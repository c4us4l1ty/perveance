[package]
name = "perveance"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }

[[bin]]
name = "perveance"
path = "src/bin/studio.rs"

[[bin]]
name = "perveance-cli"
path = "src/bin/cli.rs"
