[package]
name = "perveance"
version = "0.1.0"
edition = "2021"
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
# Parse/validate bytes only: no runtime, JIT, WASI, component or SIMD backend.
wasmparser = { version = "=0.240.0", default-features = false, features = ["std", "validate", "features"] }
# Experimental interpreter for the bounded data-only ABI diagnostic: no host
# imports, no WASI, eager translation, fuel and memory metering, deterministic.
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "validate", "deterministic", "auto-dispatch"] }

[[bin]]
name = "perveance"
path = "src/bin/studio.rs"

[[bin]]
name = "perveance-cli"
path = "src/bin/cli.rs"
