name: Lockfile diagnostic
on:
  push:
    branches: ["arena/88b8ae64-perveance"]
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Select Rust
        run: rustup default stable
      - name: Resolve the new dependency and report only the lockfile delta
        run: |
          cargo metadata --format-version 1 > /tmp/metadata.json
          git diff --stat -- Cargo.lock
          python3 - <<'PY'
          import subprocess
          delta = subprocess.run(["git", "diff", "--", "Cargo.lock"], capture_output=True, text=True, check=True).stdout
          print(f"lockfile delta bytes: {len(delta)}")
          step = 50000
          for index in range(0, len(delta), step):
              chunk = delta[index:index+step]
              escaped = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=CargoLockDelta{index}::{escaped}")
          PY
          exit 1
