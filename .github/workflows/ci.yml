name: Rust CI
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
# Avoid running both push and PR jobs for each feature-branch update. PR runs
# superseded by a newer commit can be cancelled without cancel API access.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Select Rust
        run: rustup default stable
      - name: Install Linux GUI build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-shape0-dev libxcb-xfixes0-dev xvfb xdotool libgl1-mesa-dri xauth scrot python3-pil bubblewrap
      - name: Build and test Rust
        run: |
          if cargo test --locked --all-targets > /tmp/perveance-rust-test.log 2>&1; then
            tail -n 25 /tmp/perveance-rust-test.log
          else
            cat /tmp/perveance-rust-test.log
            python3 -c 'from pathlib import Path; s=Path("/tmp/perveance-rust-test.log").read_text(errors="replace")[-2500:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
      - name: Exercise bounded data-only document lifecycle through the real CLI
        run: |
          cargo build --locked --bin perveance-cli
          if python3 tools/test_document_lifecycle.py target/debug/perveance-cli examples/opaque-document-v2.json > /tmp/perveance-document-test.log 2>&1; then
            cat /tmp/perveance-document-test.log
          else
            cat /tmp/perveance-document-test.log
            python3 -c 'from pathlib import Path; s=Path("/tmp/perveance-document-test.log").read_text(errors="replace")[-3500:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
      - name: Exercise immutable quarantine registry through the real CLI
        run: |
          if python3 tools/test_registry_lifecycle.py target/debug/perveance-cli examples/opaque-document-v2.json > /tmp/perveance-registry-test.log 2>&1; then
            cat /tmp/perveance-registry-test.log
          else
            cat /tmp/perveance-registry-test.log
            python3 -c 'from pathlib import Path; s=Path("/tmp/perveance-registry-test.log").read_text(errors="replace")[-3500:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
      - name: Exercise desktop tools under X11
        run: |
          cargo build --locked --bin perveance --bin perveance-cli
          if ! xvfb-run -a -s "-screen 0 1280x1024x24" sh -c '
            set -eu
            export LIBGL_ALWAYS_SOFTWARE=1
            export WINIT_X11_SCALE_FACTOR=1
            ./target/debug/perveance >/tmp/perveance-gui.log 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            window=$(timeout 30s xdotool search --sync --onlyvisible --name Perveance | head -n 1)
            kill -0 "$pid"
            sleep 2
            # Select the rectangle tool and drag inside the default 32x32 canvas.
            xdotool mousemove --window "$window" 65 171 click 1
            sleep 1
            xdotool mousemove --window "$window" 438 112 mousedown 1
            sleep 0.3
            xdotool mousemove --sync --window "$window" 486 160
            sleep 0.3
            xdotool mouseup 1
            sleep 1
            kill -0 "$pid"
            scrot /tmp/perveance-shape.png
            # Line: drag a diagonal on a separate part of the canvas.
            xdotool mousemove --window "$window" 65 231 click 1
            sleep 0.5
            xdotool mousemove --window "$window" 534 208 mousedown 1
            sleep 0.3
            xdotool mousemove --sync --window "$window" 582 256
            sleep 0.5
            scrot /tmp/perveance-line-preview.png
            xdotool mouseup 1
            sleep 1
            scrot /tmp/perveance-line.png
            # Pick a transparent composite pixel, then use pencil to clear a border pixel.
            xdotool mousemove --window "$window" 65 261 click 1
            sleep 0.5
            xdotool mousemove --window "$window" 550 160 click 1
            sleep 0.5
            xdotool mousemove --window "$window" 65 81 click 1
            sleep 0.5
            xdotool mousemove --window "$window" 486 112 click 1
            sleep 1
            scrot /tmp/perveance-eyedropper.png
            # Duplicate the selected layer, flip the copy and clear it; undo the clear.
            xdotool mousemove --window "$window" 1070 282 click 1
            sleep 0.5
            xdotool mousemove --window "$window" 1043 341 click 1
            sleep 1
            scrot /tmp/perveance-flipped.png
            xdotool mousemove --window "$window" 1055 373 click 1
            sleep 1
            scrot /tmp/perveance-cleared.png
            xdotool windowfocus --sync "$window"
            xdotool key --window "$window" ctrl+z
            sleep 1
            scrot /tmp/perveance-clear-undone.png
            # Request an ordinary native close on the dirty document; it must be cancelled.
            /usr/bin/python3 tools/send_x11_close.py "$window"
            sleep 1
            kill -0 "$pid"
            scrot /tmp/perveance-close-warning.png
            xdotool key --window "$window" Escape
            sleep 1
            kill -0 "$pid"
            scrot /tmp/perveance-close-cancelled.png
            /usr/bin/python3 tools/verify_gui_smoke.py
            # A fresh, unchanged document should close without a confirmation dialog.
            kill "$pid"
            wait "$pid" || true
            ./target/debug/perveance >/tmp/perveance-gui-clean.log 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            window=$(timeout 30s xdotool search --sync --onlyvisible --name Perveance | head -n 1)
            sleep 2
            /usr/bin/python3 tools/send_x11_close.py "$window"
            sleep 2
            if kill -0 "$pid" 2>/dev/null; then echo "unchanged project did not close"; exit 1; fi
            wait "$pid"
          ' >/tmp/perveance-smoke.log 2>&1; then
            cat /tmp/perveance-smoke.log /tmp/perveance-gui.log 2>/dev/null || true
            /usr/bin/python3 tools/diagnose_gui_smoke.py || true
            for file in /tmp/perveance-smoke.log /tmp/perveance-gui.log; do
              if [ -f "$file" ]; then
                tail -n 12 "$file" | while IFS= read -r line; do
                  line=${line//%/%25}
                  line=${line//$'\r'/%0D}
                  echo "::error::$line"
                done
              fi
            done
            exit 1
          fi
      - name: Exercise native GUI save and reopen workflow
        run: |
          if ! xvfb-run -a -s "-screen 0 1280x1024x24" tools/gui_project_roundtrip.sh "$RUNNER_TEMP/gui-project-roundtrip" "$GITHUB_WORKSPACE/target/debug/perveance" "$GITHUB_WORKSPACE/tools/send_x11_close.py"; then
            cat "$RUNNER_TEMP/gui-project-roundtrip/gui.log" 2>/dev/null || true
            echo "::error::Native GUI project round trip failed; see the step output"
            exit 1
          fi
      - name: Exercise native project opening and unsaved-work protection
        run: |
          if ! xvfb-run -a -s "-screen 0 1280x1024x24" tools/gui_open_project_smoke.sh "$RUNNER_TEMP/gui-open" "$GITHUB_WORKSPACE/target/debug/perveance" "$GITHUB_WORKSPACE/target/debug/perveance-cli" "$GITHUB_WORKSPACE/tools/send_x11_close.py" > "$RUNNER_TEMP/gui-open-test.log" 2>&1; then
            cat "$RUNNER_TEMP/gui-open-test.log" "$RUNNER_TEMP/gui-open/gui.log" 2>/dev/null || true
            tail -n 10 "$RUNNER_TEMP/gui-open-test.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat "$RUNNER_TEMP/gui-open-test.log"
      - name: Exercise native tool shortcuts and dialog isolation
        run: |
          if ! xvfb-run -a -s "-screen 0 1280x1024x24" tools/gui_tool_shortcuts.sh "$RUNNER_TEMP/gui-shortcuts" "$GITHUB_WORKSPACE/target/debug/perveance" "$GITHUB_WORKSPACE/tools/send_x11_close.py" > "$RUNNER_TEMP/gui-shortcuts-test.log" 2>&1; then
            cat "$RUNNER_TEMP/gui-shortcuts-test.log" "$RUNNER_TEMP/gui-shortcuts/gui.log" 2>/dev/null || true
            tail -n 10 "$RUNNER_TEMP/gui-shortcuts-test.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat "$RUNNER_TEMP/gui-shortcuts-test.log"
      - name: Exercise native region editing and undo safety
        run: |
          if ! xvfb-run -a -s "-screen 0 1280x1024x24" tools/gui_region_editing.sh "$RUNNER_TEMP/gui-regions" "$GITHUB_WORKSPACE/target/debug/perveance" "$GITHUB_WORKSPACE/tools/send_x11_close.py" > "$RUNNER_TEMP/gui-regions-test.log" 2>&1; then
            cat "$RUNNER_TEMP/gui-regions-test.log" "$RUNNER_TEMP/gui-regions/gui.log" 2>/dev/null || true
            tail -n 10 "$RUNNER_TEMP/gui-regions-test.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat "$RUNNER_TEMP/gui-regions-test.log"
      - name: Exercise agent-to-GUI-to-agent handoff
        run: |
          if ! xvfb-run -a -s "-screen 0 1280x1024x24" tools/gui_agent_handoff.sh "$RUNNER_TEMP/agent-handoff" "$GITHUB_WORKSPACE/target/debug/perveance" "$GITHUB_WORKSPACE/target/debug/perveance-cli" "$GITHUB_WORKSPACE/tools/arena_art.py" "$GITHUB_WORKSPACE/examples/rocket-operations.json" "$GITHUB_WORKSPACE/tools/send_x11_close.py"; then
            cat "$RUNNER_TEMP/agent-handoff/gui.log" 2>/dev/null || true
            echo "::error::Agent GUI handoff test failed; see the step output"
            exit 1
          fi
      - name: Test recovery after forced GUI termination
        run: |
          if ! xvfb-run -a -s "-screen 0 1280x1024x24" tools/gui_recovery_smoke.sh "$RUNNER_TEMP/gui-recovery" "$GITHUB_WORKSPACE/target/debug/perveance" "$GITHUB_WORKSPACE/tools/send_x11_close.py"; then
            cat "$RUNNER_TEMP/gui-recovery/gui.log" "$RUNNER_TEMP/gui-recovery/reopened.log" 2>/dev/null || true
            echo "::error::GUI recovery smoke failed; see the step output"
            exit 1
          fi
      - name: Test immediate recovery checkpoint after forced termination
        run: |
          if ! xvfb-run -a -s "-screen 0 1280x1024x24" tools/gui_manual_checkpoint.sh "$RUNNER_TEMP/gui-manual-recovery" "$GITHUB_WORKSPACE/target/debug/perveance" "$GITHUB_WORKSPACE/tools/send_x11_close.py" > "$RUNNER_TEMP/gui-manual-recovery.log" 2>&1; then
            cat "$RUNNER_TEMP/gui-manual-recovery.log" "$RUNNER_TEMP/gui-manual-recovery/gui.log" "$RUNNER_TEMP/gui-manual-recovery/reopened.log" 2>/dev/null || true
            tail -n 10 "$RUNNER_TEMP/gui-manual-recovery.log" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat "$RUNNER_TEMP/gui-manual-recovery.log"
      - name: Test environment probe
        run: |
          if ! python3 -m unittest discover -s tests -v > /tmp/perveance-python-tests.log 2>&1; then
            cat /tmp/perveance-python-tests.log
            exit 1
          fi
          cat /tmp/perveance-python-tests.log
          python3 -c 'from pathlib import Path; lines=Path("/tmp/perveance-python-tests.log").read_text().splitlines(); line=next(x for x in lines if x.startswith("test_network_namespace_does_not_isolate_exposed_host_unix_socket ")); result=line.rsplit(" ... ",1)[-1]; assert result == "ok" or result.startswith("skipped"); print("::notice::Fixed unshare Unix-socket control: "+result+"; if run, success demonstrates the host socket is reachable, not secure isolation")'
      - name: Run fixed isolation feasibility checks
        run: |
          if python3 tools/isolation_probe.py > /tmp/perveance-isolation.json; then
            probe_exit=0
          else
            probe_exit=$?
          fi
          cat /tmp/perveance-isolation.json
          python3 -c 'import json,sys; r=json.load(open("/tmp/perveance-isolation.json")); status=r["status"]; assert status in ("passed","failed","unavailable"); assert r["autonomous_execution"] == "disabled"; assert (int(sys.argv[1]) == 0) == (status == "passed"); print("::notice::Bubblewrap fixed probe: "+status+"; "+r["reason"]+"; autonomous execution remains disabled")' "$probe_exit"
      - name: Exercise CLI round trip
        run: |
          cargo run --locked --quiet --bin perveance-cli -- capabilities
          cargo run --locked --quiet --bin perveance-cli -- new 16 16 /tmp/perveance-ci.json
          cargo run --locked --quiet --bin perveance-cli -- paint /tmp/perveance-ci.json /tmp/perveance-painted.json 0 2 3 255 0 0 255
          cargo run --locked --quiet --bin perveance-cli -- inspect /tmp/perveance-painted.json > /tmp/perveance-inspection.json
          python3 -c 'import json; r=json.load(open("/tmp/perveance-inspection.json")); json.dump({"version":1,"base_revision":r["revision"],"prompt":"make art","budgets":{"wall_seconds":10,"cpu_seconds":10,"memory_mib":32,"scratch_mib":32,"processes":2,"model_calls":0,"model_cost_microusd":0}},open("/tmp/perveance-task.json","w"))'
          cargo run --locked --quiet --bin perveance-cli -- inspect-autonomy-request /tmp/perveance-painted.json /tmp/perveance-task.json > /tmp/perveance-intake.json
          python3 -c 'import json; r=json.load(open("/tmp/perveance-intake.json")); assert r["ok"] and r["intake"]["status"] == "blocked" and not r["intake"]["autonomous_execution"] and not r["intake"]["budgets_enforced"] and not r["intake"]["persistent_task_created"]'
          stage_parent=$(mktemp -d)
          trap 'rmdir "$stage_parent"' EXIT
          cargo run --locked --quiet --bin perveance-cli -- verify-project-staging /tmp/perveance-painted.json "$stage_parent"
          test -z "$(ls -A "$stage_parent")"
          cargo run --locked --quiet --bin perveance-cli -- sample /tmp/perveance-painted.json 2 3 composite
          cargo run --locked --quiet --bin perveance-cli -- export-png /tmp/perveance-painted.json /tmp/perveance-ci.png
          cargo run --locked --quiet --bin perveance-cli -- new 16 16 /tmp/perveance-potion-base.json
          cargo run --locked --quiet --bin perveance-cli -- apply /tmp/perveance-potion-base.json /tmp/perveance-potion.json examples/potion-operations.json
          cargo run --locked --quiet --bin perveance-cli -- export-png /tmp/perveance-potion.json /tmp/perveance-potion.png
      - name: Build experimental Linux evaluation bundle
        run: |
          cargo build --locked --release --bins
          tools/package_linux.sh target/release "$RUNNER_TEMP/perveance-distribution"
          cargo metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu > "$RUNNER_TEMP/perveance-cargo-metadata.json"
          python3 tools/license_inventory.py "$RUNNER_TEMP/perveance-cargo-metadata.json" > "$RUNNER_TEMP/perveance-distribution/LICENSE-INVENTORY.json"
          (cd "$RUNNER_TEMP/perveance-distribution" && sha256sum LICENSE-INVENTORY.json >> SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Upload experimental Linux evaluation bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perveance-linux-x86_64
          path: ${{ runner.temp }}/perveance-distribution/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Download bundle for verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: perveance-linux-x86_64
          path: ${{ runner.temp }}/perveance-downloaded
      - name: Verify and exercise the downloaded bundle
        run: |
          (cd "$RUNNER_TEMP/perveance-downloaded" && sha256sum -c SHA256SUMS)
          python3 -c 'import json,os; p=os.path.join(os.environ["RUNNER_TEMP"],"perveance-downloaded","LICENSE-INVENTORY.json"); i=json.load(open(p)); assert i["format_version"] == 1 and i["dependency_count"] == len(i["dependencies"]) > 0; print("License inventory:", i["dependency_count"], "resolved dependencies,", i["without_license_expression"], "without license expressions; review required")'
          work="$RUNNER_TEMP/perveance-bundle-test"
          mkdir "$work"
          tar -xzf "$RUNNER_TEMP/perveance-downloaded/perveance-linux-x86_64.tar.gz" -C "$work"
          bundle="$work/perveance-linux-x86_64"
          cd "$work"
          if python3 "$GITHUB_WORKSPACE/tools/test_document_lifecycle.py" "$bundle/bin/perveance-cli" "$bundle/examples/opaque-document-v2.json" > /tmp/perveance-downloaded-document-test.log 2>&1; then
            cat /tmp/perveance-downloaded-document-test.log
          else
            cat /tmp/perveance-downloaded-document-test.log
            python3 -c 'from pathlib import Path; s=Path("/tmp/perveance-downloaded-document-test.log").read_text(errors="replace")[-3500:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
          if python3 "$GITHUB_WORKSPACE/tools/test_registry_lifecycle.py" "$bundle/bin/perveance-cli" "$bundle/examples/opaque-document-v2.json" > /tmp/perveance-downloaded-registry-test.log 2>&1; then
            cat /tmp/perveance-downloaded-registry-test.log
          else
            cat /tmp/perveance-downloaded-registry-test.log
            python3 -c 'from pathlib import Path; s=Path("/tmp/perveance-downloaded-registry-test.log").read_text(errors="replace")[-3500:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
          "$bundle/bin/perveance-cli" new 16 16 base.json
          "$bundle/bin/perveance-cli" apply base.json potion.json "$bundle/examples/potion-operations.json"
          "$bundle/bin/perveance-cli" inspect potion.json > inspection.json
          "$bundle/bin/perveance-cli" sample potion.json 6 7 composite > sample.json
          "$bundle/bin/perveance-cli" export-png potion.json potion.png
          python3 -c 'import json,struct; i=json.load(open("inspection.json")); s=json.load(open("sample.json")); p=open("potion.png","rb").read(24); assert i["ok"] and i["width"]==16 and i["height"]==16 and len(i["layers"])==3; assert s["color"]==[239,204,245,255]; assert p[:8]==b"\x89PNG\r\n\x1a\n" and struct.unpack(">II",p[16:24])==(16,16)'
          # Exercise persistent jobs using the actual downloaded CLI, not cargo.
          mkdir -m 700 task-store
          python3 -c 'import json; i=json.load(open("inspection.json")); json.dump({"version":1,"base_revision":i["revision"],"operations":[{"op":"pixel","layer":0,"x":0,"y":0,"color":[11,22,33,44]}]},open("task-proposal.json","w"))'
          "$bundle/bin/perveance-cli" task-create potion.json task-proposal.json task-store > task-queued.json
          task_id=$(python3 -c 'import json; r=json.load(open("task-queued.json")); assert r["task"]["state"]=="queued" and not r["task"]["autonomous_execution"]; print(r["task"]["id"])')
          "$bundle/bin/perveance-cli" task-run task-store "$task_id" > task-completed.json
          "$bundle/bin/perveance-cli" task-inspect task-store "$task_id" > task-inspected.json
          "$bundle/bin/perveance-cli" sample "task-store/$task_id/output.perveance.json" 0 0 layer 0 > task-sample.json
          python3 -c 'import json; a=json.load(open("task-completed.json"))["task"]; b=json.load(open("task-inspected.json"))["task"]; assert a==b and a["state"]=="succeeded" and a["artifacts_verified"] and len(a["history"])==3 and not a["network_used"] and not a["autonomous_execution"]; assert json.load(open("task-sample.json"))["color"]==[11,22,33,44]; print("Downloaded CLI persistent raster-task round trip passed")'
          # Descriptor-confined input and atomic two-artifact publication using
          # the downloaded executable, with no worker/cgroup prerequisite.
          mkdir -m 700 mediated-input mediated-output
          cp potion.json mediated-input/source.json
          chmod 600 mediated-input/source.json
          "$bundle/bin/perveance-cli" publish-raster-bundle "$work/mediated-input" source.json "$work/mediated-output" result > publication.json
          "$bundle/bin/perveance-cli" inspect mediated-output/result/output.perveance.json > publication-project.json
          python3 -c 'import hashlib,json,pathlib; r=json.load(open("publication.json"))["publication"]; assert r["committed"] and r["parent_directory_synced"] and not r["autonomous_execution"]; assert r["revision"]==json.load(open("inspection.json"))["revision"]==json.load(open("publication-project.json"))["revision"]; root=pathlib.Path("mediated-output/result"); assert {p.name for p in root.iterdir()}=={"output.perveance.json","output.png"}; assert all(a["bytes"]==(root/a["file"]).stat().st_size and a["sha256"]==hashlib.sha256((root/a["file"]).read_bytes()).hexdigest() for a in r["artifacts"]); print("Downloaded CLI descriptor-mediated project/PNG publication passed")'
          if "$bundle/bin/perveance-cli" publish-raster-bundle "$work/mediated-input" source.json "$work/mediated-output" result > /dev/null 2> publication-collision.json; then
            echo "::error::Publication unexpectedly replaced an occupied name"
            exit 1
          fi
          python3 -c 'import json,pathlib; assert json.load(open("publication-collision.json"))["ok"] is False; assert len(list(pathlib.Path("mediated-output").iterdir()))==1'
          # Durable broker reservations through the downloaded executable. This
          # is an offline synthetic-key fixture, never a paid provider test.
          mkdir -m 700 broker-ledger broker-requests
          "$bundle/bin/perveance-cli" broker-ledger-init "$work/broker-ledger" 1 10 10 > broker-initial.json
          python3 -c 'import json; json.dump({"version":1,"id":"00000000000000000000000000000001","prompt":"offline downloaded-broker fixture","max_output_tokens":10},open("broker-requests/call.json","w"))'
          chmod 600 broker-requests/call.json
          "$bundle/bin/perveance-cli" broker-fixture-call "$work/broker-ledger" "$work/broker-requests" call.json > broker-first.json
          "$bundle/bin/perveance-cli" broker-fixture-call "$work/broker-ledger" "$work/broker-requests" call.json > broker-duplicate.json
          python3 -c 'import json; p="broker-requests/call.json"; r=json.load(open(p)); r["id"]="00000000000000000000000000000002"; json.dump(r,open(p,"w"))'
          "$bundle/bin/perveance-cli" broker-fixture-call "$work/broker-ledger" "$work/broker-requests" call.json > broker-exhausted.json
          "$bundle/bin/perveance-cli" broker-ledger-inspect "$work/broker-ledger" > broker-inspected.json
          python3 -c 'import json,pathlib; a=json.load(open("broker-first.json"))["fixture"]; b=json.load(open("broker-duplicate.json"))["fixture"]; c=json.load(open("broker-exhausted.json"))["fixture"]; d=json.load(open("broker-inspected.json"))["ledger"]; assert a["reply"]["status"]=="completed" and a["service"]["provider_called"] and a["service"]["outcome_recorded"]; assert b["reply"]["status"]=="already_finished" and b["reply"]["text"] is None and not b["service"]["provider_called"]; assert c["reply"]["status"]=="budget_exhausted" and not c["service"]["provider_called"]; assert all(x["fixture_only"] and not x["network_used"] and not x["autonomous_execution"] for x in (a,b,c)); assert d["reserved_calls"]==1 and d["reserved_cost_microusd"]==10 and d["calls"][0]["actual_cost_microusd"]==5 and not d["halted"]; data=pathlib.Path("broker-ledger/model-budget.v1").read_bytes(); assert b"offline downloaded-broker fixture" not in data and b"synthetic-offline-broker-credential" not in data; print("Downloaded CLI offline broker reservation/restart/deduplication/exhaustion passed")'
          # Fixed worker-task persistence using the downloaded binary. This
          # ordinary host does not attest cgroup support; refusal must not spend.
          mkdir -m 700 worker-jobs
          cp task-proposal.json mediated-input/pixels.json
          chmod 600 mediated-input/pixels.json
          "$bundle/bin/perveance-cli" worker-task-create "$work/mediated-input" source.json "$work/mediated-input" pixels.json "$work/worker-jobs" > worker-queued.json
          worker_id=$(python3 -c 'import json; r=json.load(open("worker-queued.json"))["task"]; assert r["state"]=="queued" and r["ledger"]["reserved_calls"]==0 and r["synthetic_fixture_only"] and not r["autonomous_execution"]; print(r["id"])')
          if "$bundle/bin/perveance-cli" worker-task-run "$work/worker-jobs" "$worker_id" "$work/worker-jobs" > /dev/null 2> worker-unsupported.json; then
            echo "::error::Fixed pixel task accepted an ordinary filesystem as its backend"
            exit 1
          fi
          "$bundle/bin/perveance-cli" worker-task-inspect "$work/worker-jobs" "$worker_id" > worker-inspected.json
          "$bundle/bin/perveance-cli" worker-task-cancel "$work/worker-jobs" "$worker_id" > worker-cancel.json
          "$bundle/bin/perveance-cli" worker-task-inspect "$work/worker-jobs" "$worker_id" > worker-cancelled.json
          python3 -c 'import json,pathlib; a=json.load(open("worker-inspected.json"))["task"]; b=json.load(open("worker-cancelled.json"))["task"]; assert a["state"]=="queued" and a["ledger"]["reserved_calls"]==0 and not a["resource_quotas_enforced"]; assert b["state"]=="cancelled" and b["cancel_requested"] and b["ledger"]["reserved_calls"]==0 and b["outputs"] is None and not b["autonomous_execution"] and not b["provider_network_used"]; assert not any(pathlib.Path("worker-jobs").glob("*/result")); print("Downloaded CLI fixed pixel task capture/inspect/backend refusal/cancel passed; no execution authorized")'
          PERVEANCE_BIN="$bundle/bin/perveance" CLOSE_HELPER="$GITHUB_WORKSPACE/tools/send_x11_close.py" xvfb-run -a sh -c '
            set -eu
            export LIBGL_ALWAYS_SOFTWARE=1
            "$PERVEANCE_BIN" > "$RUNNER_TEMP/perveance-bundle-gui.log" 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            window=$(timeout 30s xdotool search --sync --onlyvisible --name Perveance | head -n 1)
            kill -0 "$pid"
            sleep 2
            /usr/bin/python3 "$CLOSE_HELPER" "$window"
            sleep 2
            if kill -0 "$pid" 2>/dev/null; then cat "$RUNNER_TEMP/perveance-bundle-gui.log"; echo "bundled GUI did not close"; exit 1; fi
            wait "$pid"
          '
