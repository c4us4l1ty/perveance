name: Fixed sandbox feasibility matrix
on:
  push:
    branches: ["arena/**"]
    paths: ["tools/isolation_probe.py", "tests/test_isolation_probe.py", ".github/workflows/sandbox-feasibility.yml"]
  pull_request:
    paths: ["tools/isolation_probe.py", "tests/test_isolation_probe.py", ".github/workflows/sandbox-feasibility.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install diagnostic tool
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Observe host prerequisites without changing security policy
        run: |
          uname -sr
          . /etc/os-release; printf 'OS: %s\n' "$PRETTY_NAME"
          bwrap --version
          stat -c 'bwrap mode: %a' /usr/bin/bwrap
          if command -v getcap >/dev/null; then getcap /usr/bin/bwrap; fi
          for path in /proc/sys/kernel/apparmor_restrict_unprivileged_userns /proc/sys/kernel/unprivileged_userns_clone /proc/sys/user/max_user_namespaces; do
            if test -r "$path"; then printf '%s: ' "$path"; cat "$path"; fi
          done
          # Do not run a setuid, setgid or file-capability-enabled helper.
          python3 -c 'import os,stat; s=os.stat("/usr/bin/bwrap"); assert not s.st_mode & (stat.S_ISUID|stat.S_ISGID); caps=os.getxattr("/usr/bin/bwrap", "security.capability") if "security.capability" in os.listxattr("/usr/bin/bwrap") else b""; assert not caps'
      - name: Run fixed probe and report observations
        run: |
          if python3 tools/isolation_probe.py > /tmp/perveance-isolation-matrix.json; then code=0; else code=$?; fi
          cat /tmp/perveance-isolation-matrix.json
          python3 -c 'import json,sys; r=json.load(open("/tmp/perveance-isolation-matrix.json")); assert r["status"] in ("passed","failed","unavailable"); assert r["autonomous_execution"] == "disabled"; assert (int(sys.argv[1]) == 0) == (r["status"] == "passed"); print("::notice::Fixed probe "+sys.argv[2]+": "+r["status"]+"; "+r["reason"]+"; no execution authorized")' "$code" '${{ matrix.os }}'
