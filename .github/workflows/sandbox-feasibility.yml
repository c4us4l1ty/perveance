name: Fixed sandbox feasibility matrix
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
# Avoid running both push and PR jobs for each feature-branch update. PR runs
# superseded by a newer commit can be cancelled without cancel API access.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install diagnostic tool
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Observe host prerequisites without changing security policy
        run: |
          uname -sr
          . /etc/os-release; printf 'OS: %s\n' "$PRETTY_NAME"
          test "$(command -v bwrap)" = /usr/bin/bwrap
          stat -c 'bwrap mode: %a' /usr/bin/bwrap
          if command -v getcap >/dev/null; then getcap /usr/bin/bwrap; fi
          for path in /proc/sys/kernel/apparmor_restrict_unprivileged_userns /proc/sys/kernel/unprivileged_userns_clone /proc/sys/user/max_user_namespaces; do
            if test -r "$path"; then printf '%s: ' "$path"; cat "$path"; fi
          done
          # Do not run a setuid, setgid or file-capability-enabled helper.
          python3 -c 'import os,stat; s=os.stat("/usr/bin/bwrap"); assert not s.st_mode & (stat.S_ISUID|stat.S_ISGID); caps=os.getxattr("/usr/bin/bwrap", "security.capability") if "security.capability" in os.listxattr("/usr/bin/bwrap") else b""; assert not caps'
          bwrap --version
          python3 -c 'import os,platform,subprocess; paths=("/proc/sys/kernel/apparmor_restrict_unprivileged_userns","/proc/sys/kernel/unprivileged_userns_clone","/proc/sys/user/max_user_namespaces"); values=[os.path.basename(p)+"="+(open(p).read().strip() if os.path.isfile(p) else "missing") for p in paths]; print("::notice::Runner "+platform.release()+"; "+subprocess.check_output(["/usr/bin/bwrap","--version"],text=True).strip()+"; "+"; ".join(values))'
      - name: Run fixed probe and report observations
        run: |
          if python3 tools/isolation_probe.py > /tmp/perveance-isolation-matrix.json; then code=0; else code=$?; fi
          cat /tmp/perveance-isolation-matrix.json
          python3 -c 'import json,sys; r=json.load(open("/tmp/perveance-isolation-matrix.json")); assert r["status"] in ("passed","failed","unavailable"); assert r["autonomous_execution"] == "disabled"; assert (int(sys.argv[1]) == 0) == (r["status"] == "passed"); print("::notice::Fixed probe "+sys.argv[2]+": "+r["status"]+"; "+r["reason"]+"; no execution authorized")' "$code" '${{ matrix.os }}'
      - name: Require the fixed checks on the selected CI diagnostic image
        if: matrix.os == 'ubuntu-26.04'
        run: |
          python3 -c 'import json; r=json.load(open("/tmp/perveance-isolation-matrix.json")); assert r["status"] == "passed", "fixed diagnostic did not pass; see previous step"; assert r["autonomous_execution"] == "disabled"'
      - name: Install prerequisites for staged project test
        if: matrix.os == 'ubuntu-26.04'
        run: sudo apt-get install -y libx11-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Run fixed worker against real project staging
        if: matrix.os == 'ubuntu-26.04'
        run: |
          rustup default stable
          if cargo test --locked --test workspace linux::fixed_staged_project_worker -- --ignored --exact --nocapture > /tmp/perveance-staged-worker.log 2>&1; then
            cat /tmp/perveance-staged-worker.log
            python3 -c 'from pathlib import Path; s=Path("/tmp/perveance-staged-worker.log").read_text(); assert "1 passed; 0 failed" in s; print("::notice::Fixed bubblewrap worker read an actual staged project; no model code or execution authorization")'
          else
            cat /tmp/perveance-staged-worker.log
            python3 -c 'from pathlib import Path; s=Path("/tmp/perveance-staged-worker.log").read_text(errors="replace")[-2500:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
      - name: Test fixed worker supervision and cleanup
        if: matrix.os == 'ubuntu-26.04'
        run: |
          if cargo test --locked --test fixed_worker fixed_worker_lifecycle_on_supported_host -- --ignored --exact --nocapture > /tmp/perveance-fixed-lifecycle.log 2>&1; then
            cat /tmp/perveance-fixed-lifecycle.log
            python3 -c 'from pathlib import Path; s=Path("/tmp/perveance-fixed-lifecycle.log").read_text(); assert "1 passed; 0 failed" in s; observation=next(x for x in s.splitlines() if "bare bubblewrap synthetic descriptor:" in x).split("bare bubblewrap synthetic descriptor:",1)[1].strip(); assert observation in ("inherited","closed"); print("::notice::Bare bubblewrap synthetic descriptor: "+observation+"; fixed worker closes extra FDs; lifecycle tests passed; autonomy disabled")'
          else
            cat /tmp/perveance-fixed-lifecycle.log
            python3 -c 'from pathlib import Path; s=Path("/tmp/perveance-fixed-lifecycle.log").read_text(errors="replace")[-2500:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
      - name: Test fixed worker CLI diagnostic
        if: matrix.os == 'ubuntu-26.04'
        run: |
          if cargo test --locked --test cli fixed_worker_cli_on_supported_host -- --ignored --exact > /tmp/perveance-fixed-cli.log 2>&1; then
            cat /tmp/perveance-fixed-cli.log
            python3 -c 'from pathlib import Path; s=Path("/tmp/perveance-fixed-cli.log").read_text(); assert "1 passed; 0 failed" in s'
          else
            cat /tmp/perveance-fixed-cli.log
            python3 -c 'from pathlib import Path; s=Path("/tmp/perveance-fixed-cli.log").read_text(errors="replace")[-2500:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
      - name: Build resource-enforced fixed diagnostic tests
        if: matrix.os == 'ubuntu-26.04'
        run: |
          cargo test --locked --test bounded_worker --no-run --message-format=json > /tmp/perveance-bounded-build.json
          python3 -c 'import json; rows=[json.loads(x) for x in open("/tmp/perveance-bounded-build.json")]; bins=[r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("target",{}).get("name")=="bounded_worker" and r.get("executable")]; assert len(bins)==1; open("/tmp/perveance-bounded-test-bin","w").write(bins[0])'
      - name: Require real cgroup quotas and whole-tree cleanup on the delegated CI backend
        if: matrix.os == 'ubuntu-26.04'
        run: |
          # Privilege is used only to provision one disposable systemd service.
          # The application, tests, watchdog and bwrap all run as the runner user.
          # No host policy changes, writable host mounts, or privileged fallback.
          unit="perveance-bounded-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test_bin=$(cat /tmp/perveance-bounded-test-bin)
          if sudo systemd-run --unit="$unit" --wait --pipe --collect --service-type=exec \
            --uid="$(id -u)" --gid="$(id -g)" --working-directory="$GITHUB_WORKSPACE" \
            --property=Delegate=yes --property=DelegateSubgroup=supervisor \
            --property=ProtectControlGroups=no --property=KillMode=control-group \
            --property=RuntimeMaxSec=180 --property=MemoryMax=768M --property=TasksMax=128 \
            /bin/bash "$GITHUB_WORKSPACE/tools/test_bounded_worker.sh" "$test_bin" > /tmp/perveance-bounded-kernel.log 2>&1; then
            cat /tmp/perveance-bounded-kernel.log
            python3 -c 'from pathlib import Path; s=Path("/tmp/perveance-bounded-kernel.log").read_text(); assert "11 passed; 0 failed" in s; print("::notice::Eleven real cgroup-v2 tests passed: confined broker protocol/credential denial, scoped cancellation, broker SIGKILL/SIGSTOP, sealed input, quotas and whole-tree recovery; fixed offline code only, autonomy disabled")'
          else
            cat /tmp/perveance-bounded-kernel.log
            python3 -c 'from pathlib import Path; s=Path("/tmp/perveance-bounded-kernel.log").read_text(errors="replace")[-10000:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
            exit 1
          fi
